<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>

<style>
    body {
        margin: 0;
        background: #f5f5f5;
        color: #222;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 80px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 20px;
        font-weight: 300;
        color: #333;
    }

    #search {
        width: 60%;
        max-width: 600px;
        padding: 14px 18px;
        border-radius: 30px;
        border: 1px solid #ccc;
        font-size: 18px;
        outline: none;
        background: white;
        color: #222;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    #search:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 10px rgba(74,144,226,0.3);
    }

    #links {
        margin-top: 40px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .card {
        background: white;
        padding: 18px 26px;
        border-radius: 12px;
        text-decoration: none;
        color: #222;
        font-size: 18px;
        transition: 0.2s;
        border: 1px solid #ddd;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .card:hover {
        background: #f0f0f0;
        transform: translateY(-3px);
        border-color: #bbb;
    }
</style>

</head>
<body>

<h1>Connected ccqhash</h1>

<input id="search" type="text" placeholder="Zoeken op Google…">

<div id="links">
    <a class="card" href="https://www.youtube.com">YouTube</a>
    <a class="card" href="https://www.github.com">GitHub</a>
    <a class="card" href="https://www.reddit.com">Reddit</a>
    <a class="card" href="https://www.wikipedia.org">Wikipedia</a>
    <a class="card" href="https://www.google.com/maps">Maps</a>
</div>

<script>
document.getElementById("search").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        const q = encodeURIComponent(e.target.value);
        window.location.href = "https://www.google.com/search?q=" + q;
    }
});
</script>

</body>
</html>
